services:
  - type: web
    name: api-monitoring-alert-system
    branch: v2
    runtime: node
    plan: 1c-2g
    numInstances: 1
    buildCommand: npm ci && npm --prefix client ci && npm run build:client
    startCommand: npm start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
    # Render injects PORT (default 10000); the server binds to that port and 0.0.0.0.
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_TIMEOUT_MS
        value: 10000
      - key: MONITOR_BODY_LIMIT
        value: 1mb
      - key: MONITOR_MAX_BATCH_SIZE
        value: 100
      - key: MONITOR_CONCURRENCY
        value: 5
      - key: MONITOR_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: MONITOR_RATE_LIMIT_MAX
        value: 10
      - key: API_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: API_RATE_LIMIT_MAX
        value: 120
      - key: ALERTS_DEFAULT_PAGE_SIZE
        value: 20
      - key: ALERTS_MAX_PAGE_SIZE
        value: 50
      - key: GEMINI_DAILY_CALL_LIMIT
        value: 25
      - key: TRUST_PROXY
        value: 1
      - key: PUBLIC_APP_URL
        sync: false
      - key: WORKSPACE_CREATE_RATE_LIMIT_WINDOW_MS
        value: 3600000
      - key: WORKSPACE_CREATE_RATE_LIMIT_MAX
        value: 5
      - key: MONITOR_CREATE_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: MONITOR_CREATE_RATE_LIMIT_MAX
        value: 30
      - key: MONITORS_PER_WORKSPACE_MAX
        value: 50
      - key: MONITORS_TOTAL_MAX
        value: 1000
      - key: WORKSPACE_INACTIVE_PURGE_DAYS
        value: 90
      - key: WORKSPACE_ACCESS_LINK_TTL_MINUTES
        value: 15
      - key: ALLOW_PRIVATE_TARGETS
        value: "false"
      - key: MONITOR_RESPONSE_MAX_BYTES
        value: 1048576
      - key: CHECK_HISTORY_RETENTION_DAYS
        value: 14
      - key: CHECK_HISTORY_MAX_PAGE_SIZE
        value: 50
      - key: CHECK_NOW_WORKSPACE_WINDOW_MS
        value: 3600000
      - key: CHECK_NOW_WORKSPACE_MAX
        value: 30
      - key: CHECK_NOW_MONITOR_WINDOW_MS
        value: 3600000
      - key: CHECK_NOW_MONITOR_MAX
        value: 6
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_TICK_INTERVAL_MS
        value: 5000
      - key: SCHEDULER_CONCURRENCY
        value: 5
      - key: SCHEDULER_MAX_CHECKS_PER_MINUTE
        value: 60
      - key: SCHEDULER_JITTER_MS
        value: 5000
      - key: AUTO_RESOLVE_CONSECUTIVE_HEALTHY_CHECKS
        value: 2
      - key: LOG_LEVEL
        value: info
      - key: MONITOR_CHECK_LEASE_MS
        value: 120000
